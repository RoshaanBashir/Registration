<div class="signup-container">
  <h2>Sign Up</h2>
  <p class="auth-switch-text">
    Already have an account?
    <a routerLink="/login">Back to login</a>
  </p>

  <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
    <div class="form-group">
      <label>Username</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        autocomplete="username"
        required
        #usernameCtrl="ngModel"
      />
      <small *ngIf="usernameCtrl.invalid && usernameCtrl.touched">Username is required</small>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="new-password"
        required
        minlength="6"
        #passwordCtrl="ngModel"
      />
      <small *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
        Password must be at least 6 characters
      </small>
    </div>

    <button type="submit" [disabled]="signupForm.invalid || isLoading">
      {{ isLoading ? 'Creating account...' : 'Sign Up' }}
    </button>

    <small *ngIf="successMessage" style="color: green; display: block; margin-top: 10px;">
      {{ successMessage }}
    </small>
    <small *ngIf="errorMessage" style="color: #c62828; display: block; margin-top: 10px;">
      {{ errorMessage }}
    </small>
    <small *ngIf="debugMessage" style="color: #666; display: block; margin-top: 8px;">
      {{ debugMessage }}
    </small>
  </form>
</div>
